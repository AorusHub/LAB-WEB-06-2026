<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Praktikum 5</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <main class="w-full max-w-3xl rounded-3xl bg-white shadow-xl overflow-hidden">
      <section class="bg-gradient-to-r from-blue-600 to-indigo-600 p-6 text-white">
        <div class="flex items-center justify-between gap-4 flex-wrap">
          <div>
            <p class="text-sm uppercase tracking-[0.2em] opacity-80">Praktikum 5</p>
            <h1 class="text-3xl font-bold mt-2">Daftar Tugas</h1>
          </div>
          <div class="bg-white/10 px-4 py-2 rounded-full backdrop-blur-sm">
            <span id="task-count" class="font-semibold">0 tugas</span>
          </div>
        </div>
      </section>

      <section class="p-6">
        <form id="task-form" class="flex flex-col md:flex-row gap-3 mb-6">
          <input
            id="task-input"
            type="text"
            placeholder="Masukkan tugas baru..."
            class="flex-1 border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            autocomplete="off"
          />
          <button
            type="submit"
            class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-5 py-3 rounded-xl transition"
          >
            Tambah
          </button>
        </form>

        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 mb-5">
          <div class="relative flex-1">
            <input
              id="search-input"
              type="text"
              placeholder="Cari tugas..."
              class="w-full border border-slate-300 rounded-xl px-4 py-3 pl-10 focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
            <span class="absolute left-3 top-3.5 text-slate-400">🔎</span>
          </div>

          <div class="flex gap-2 flex-wrap">
            <button type="button" class="filter-btn active bg-indigo-600 text-white px-3 py-2 rounded-lg text-sm" data-filter="all">
              Semua
            </button>
            <button type="button" class="filter-btn bg-slate-200 text-slate-700 px-3 py-2 rounded-lg text-sm" data-filter="active">
              Aktif
            </button>
            <button type="button" class="filter-btn bg-slate-200 text-slate-700 px-3 py-2 rounded-lg text-sm" data-filter="completed">
              Selesai
            </button>
          </div>
        </div>

        <div class="flex justify-between items-center mb-4">
          <h2 class="font-semibold text-slate-700">List tugas</h2>
          <button id="clear-completed" type="button" class="text-sm text-red-500 hover:text-red-600 font-medium">
            Hapus selesai
          </button>
        </div>

        <ul id="task-list" class="space-y-3"></ul>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
